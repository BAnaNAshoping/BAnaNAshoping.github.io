<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BANANA - Wishlist</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap');

        :root {
            --bronze:#D3A54F;
            --taupe:#423629;
            --lavander:#7D6B91;
            --grapefruit:#FE6D73;
            --blue:#0C6291;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bronze);
            color: var(--taupe);
            line-height: 1.5;
            font-family: Arial, sans-serif;
        }

        .caacupe-one-regular {
            font-family: "Caacupe One", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        header {
            background: var(--bronze);
            font-size: 30px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 60px;
        }

        .logo .logo-image img {
            width: 180px;
            display: inline-block;
        }

        nav {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--taupe);
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--blue);
        }

        main {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 25px;
        }

        h1 {
            font-family: "Caacupe One", sans-serif;
            font-size: 60px;
            margin-bottom: 30px;
        }

        .cart-box {
            background: #f8e7bf;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(66, 54, 41, .15);
        }

        .empty-wishlist {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-wishlist h2 {
            font-family: "Caacupe One", sans-serif;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .empty-wishlist p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .heart {
            font-size: 70px;
            margin-bottom: 10px;
        }

        .shop-button {
            display: inline-block;
            background: var(--blue);
            color: white;
            text-decoration: none;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        .shop-button:hover {
            background: var(--lavander);
        }

        @media (max-width: 750px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .logo {
                font-size: 45px;
            }

            .logo .logo-image img {
                width: 140px;
            }

            h1 {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo caacupe-one-regular">
            <span class="logo-image">
                <img src="logo.png" alt="BANANA logo">
            </span>
            &lt;BAnanAS&gt;
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="Cart.html">Cart</a>
            <a href="wh.html">Wishlist</a>
            <a href="track.html">Track status</a>
        </nav>
    </header>

    <main>
        <h1>MY WISHLIST</h1>

        <div class="cart-box">
            <div class="empty-cart">
                <div class="heart">♡</div>
                <h2>Your wishlist is empty</h2>
                <p>Save your favorite products here so you can find them later.</p>
                <a class="shop-button" href="Sell.html">Browse Products</a>
            </div>
        </div>
    </main>
</body>
</html>
