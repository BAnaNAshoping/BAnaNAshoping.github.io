<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BANANA - Track Status</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap');

        :root {
            --bronze:#D3A54F;
            --taupe:#423629;
            --lavander:#7D6B91;
            --grapefruit:#FE6D73;
            --blue:#0C6291;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bronze);
            color: var(--taupe);
            line-height: 1.5;
            font-family: Arial, sans-serif;
        }

        .caacupe-one-regular {
            font-family: "Caacupe One", sans-serif;
            font-weight: 400;
        }

        header {
            background: var(--bronze);
            font-size: 30px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 60px;
        }

        .logo .logo-image img {
            width: 180px;
            display: inline-block;
        }

        nav {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--taupe);
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--blue);
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 25px;
        }

        h1 {
            font-family: "Caacupe One", sans-serif;
            font-size: 60px;
            margin-bottom: 30px;
        }

        .track-box {
            background: #f8e7bf;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 20px rgba(66, 54, 41, .15);
        }

        .track-box h2 {
            font-family: "Caacupe One", sans-serif;
            font-size: 35px;
            margin-bottom: 20px;
        }

        .track-form {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
        }

        .track-form input {
            flex: 1;
            padding: 15px 18px;
            border: 2px solid var(--taupe);
            border-radius: 30px;
            background: white;
            font-size: 17px;
            color: var(--taupe);
        }

        .track-form button {
            border: none;
            border-radius: 30px;
            padding: 15px 28px;
            background: var(--blue);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .track-form button:hover {
            background: var(--lavander);
        }

        #status {
            display: none;
            margin-top: 25px;
        }

        .status-title {
            font-family: "Caacupe One", sans-serif;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .timeline {
            border-left: 4px solid var(--blue);
            margin-left: 15px;
            padding-left: 30px;
        }

        .step {
            position: relative;
            margin-bottom: 25px;
        }

        .step::before {
            content: "";
            position: absolute;
            left: -42px;
            top: 5px;
            width: 18px;
            height: 18px;
            background: var(--blue);
            border-radius: 50%;
            border: 4px solid #f8e7bf;
        }

        .step h3 {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .step p {
            font-size: 16px;
        }

        .message {
            margin-top: 20px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .logo {
                font-size: 45px;
            }

            .logo .logo-image img {
                width: 140px;
            }

            h1 {
                font-size: 45px;
            }

            .track-form {
                flex-direction: column;
            }

            .track-form button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo caacupe-one-regular">
            <span class="logo-image">
                <img src="logo.png" alt="BANANA logo">
            </span>
            &lt;BAnanAS&gt;
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="Cart.html">Cart</a>
            <a href="wh.html">Wishlist</a>
            <a href="track.html">Track status</a>
        </nav>
    </header>

    <main>
        <h1>TRACK STATUS</h1>

        <div class="track-box">
            <h2>Where is my order?</h2>

            <form class="track-form" onsubmit="trackOrder(event)">
                <input
                    type="text"
                    id="trackingNumber"
                    placeholder="Enter your order or tracking number"
                    required>
                <button type="submit">Track Order</button>
            </form>

            <div id="status">
                <div class="status-title">Order Status</div>

                <div class="timeline">
                    <div class="step">
                        <h3>✓ Order placed</h3>
                        <p>Your order has been received.</p>
                    </div>

                    <div class="step">
                        <h3>✓ Preparing</h3>
                        <p>Your items are being prepared.</p>
                    </div>

                    <div class="step">
                        <h3>→ Shipped</h3>
                        <p>Your package is on its way.</p>
                    </div>

                    <div class="step">
                        <h3>Delivery</h3>
                        <p>Your package will arrive soon.</p>
                    </div>
                </div>

                <p class="message" id="orderMessage"></p>
            </div>
        </div>
    </main>

    <script>
        function trackOrder(event) {
            event.preventDefault();

            const number = document.getElementById("trackingNumber").value.trim();

            document.getElementById("status").style.display = "block";
            document.getElementById("orderMessage").textContent =
                "Tracking order: " + number;
        }
    </script>
</body>
</html>
